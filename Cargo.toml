[package]
name = "erislint"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Configurable Rust lint rules evaluated by Jev"

[dependencies]
annotate-snippets = "0.12.16"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
ra_ap_syntax = "=0.0.349"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
